name: Build Astro blog from private source and deploy to Pages

on:
  push:
    branches: [main]
  # 供 blog-source 推送后自动触发（需在 blog-source 配 PAGES_DISPATCH_TOKEN）
  repository_dispatch:
    types: [blog-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source (blog-source, branch=firefly)
        uses: actions/checkout@v4
        with:
          repository: Arkmana/blog-source
          ref: firefly
          path: src-repo
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: pnpm
          cache-dependency-path: src-repo/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src-repo
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: src-repo
        run: pnpm run build

      - name: Add .nojekyll
        working-directory: src-repo
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src-repo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
